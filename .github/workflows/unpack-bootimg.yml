name: 解包 boot.img 提取 vmlinux 符号表

on:
  workflow_dispatch:
    inputs:
      bootimg_url:
        description: 'boot.img 下载链接（直接下载地址）'
        required: true
        default: ''

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: 安装工具
        run: |
          sudo apt-get update
          sudo apt-get install -y abootimg lz4 zstd gzip binutils-aarch64-linux-gnu wget file python3

      - name: 下载 boot.img
        run: |
          wget -q --show-progress "${{ github.event.inputs.bootimg_url }}" -O boot.img
          ls -lh boot.img
          file boot.img

      - name: 解包 boot.img
        run: |
          mkdir -p output
          # 方法1: abootimg（标准AOSP格式）
          abootimg -x boot.img || true
          ls -la

      - name: 提取 vmlinux
        run: |
          # 安装 extract-vmlinux
          sudo wget -q https://raw.githubusercontent.com/torvalds/linux/master/scripts/extract-vmlinux -O /usr/local/bin/extract-vmlinux
          sudo chmod +x /usr/local/bin/extract-vmlinux
          
          # 找到内核文件
          KERNEL=""
          [ -f zImage ] && KERNEL="zImage"
          [ -f kernel ] && KERNEL="kernel"
          [ -f boot.img-kernel ] && KERNEL="boot.img-kernel"
          
          if [ -z "$KERNEL" ]; then
            echo "未找到标准内核文件，尝试用 binwalk 提取..."
            sudo apt-get install -y binwalk
            binwalk -e boot.img
            KERNEL=$(find . -name "kernel" -o -name "zImage" | head -1)
          fi
          
          echo "使用内核文件: $KERNEL"
          
          # 提取 vmlinux
          extract-vmlinux "$KERNEL" > output/vmlinux || true
          
          # 手动解压备用方案
          if [ ! -s output/vmlinux ]; then
            zcat "$KERNEL" > output/vmlinux 2>/dev/null || \
            lz4 -d "$KERNEL" output/vmlinux 2>/dev/null || \
            zstd -d "$KERNEL" -o output/vmlinux 2>/dev/null || \
            cp "$KERNEL" output/vmlinux
          fi
          
          file output/vmlinux

      - name: 提取符号表
        run: |
          cd output
          aarch64-linux-gnu-nm -n vmlinux > symbols_all.txt 2>/dev/null || nm -n vmlinux > symbols_all.txt
          grep -E '^[0-9a-f]+ [Tt] ' symbols_all.txt | awk '{print $1, $3}' > functions.txt
          aarch64-linux-gnu-readelf -s vmlinux > symbols_detail.txt 2>/dev/null || readelf -s vmlinux > symbols_detail.txt
          readelf -S vmlinux > sections.txt
          echo "=== 提取完成 ==="
          wc -l symbols_all.txt functions.txt

      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: vmlinux-and-symbols
          path: output/
          retention-days: 30
