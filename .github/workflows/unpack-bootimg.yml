name: 解包 boot.img 提取 vmlinux 符号表

on:
  workflow_dispatch:
    inputs:
      bootimg_url:
        description: 'boot.img 下载链接（直接下载地址）'
        required: true
        default: ''

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: 安装工具
        run: |
          sudo apt-get update
          sudo apt-get install -y lz4 zstd gzip binutils-aarch64-linux-gnu wget file android-sdk-libsparse-utils

      - name: 下载 boot.img
        run: |
          wget -q --show-progress "${{ github.event.inputs.bootimg_url }}" -O boot.img
          ls -lh boot.img
          echo "=== 文件类型检测 ==="
          file boot.img
          xxd -l 64 boot.img | head -5

      - name: 转换 sparse 格式（如果是 simg）
        run: |
          # 检查是否是 sparse 格式（魔数 0x3aff26ed）
          MAGIC=$(xxd -l 4 -p boot.img)
          if [ "$MAGIC" = "3aff26ed" ] || [ "$MAGIC" = "ed26ff3a" ]; then
            echo "检测到 sparse 格式，正在转换..."
            simg2img boot.img boot_raw.img
            mv boot_raw.img boot.img
          else
            echo "不是 sparse 格式，跳过转换"
          fi

      - name: 用 Python 解析并提取内核
        run: |
          python3 << 'EOF'
          import struct
          import sys
          
          BOOTIMG = "boot.img"
          KERNEL_OUT = "kernel_raw"
          
          with open(BOOTIMG, "rb") as f:
              header = f.read(4096)
          
          # 读取魔数判断版本
          magic = header[:8]
          print(f"Header magic: {magic}")
          
          # AOSP boot image header v0/v1/v2 (基于 https://android.googlesource.com/platform/system/tools/mkbootimg/+/refs/heads/master/include/bootimg/bootimg.h)
          # 页大小通常在偏移 36 (0x24)
          page_size = struct.unpack_from("<I", header, 0x24)[0]
          print(f"Page size: {page_size}")
          
          if page_size not in [2048, 4096, 8192, 16384, 32768, 65536, 131072]:
              # 可能是 v3/v4 格式，页大小在偏移 0x24 但结构不同
              # v3/v4: kernel_size 在 0x08, ramdisk_size 在 0x10, os_version 在 0x18
              page_size = 4096  # v3/v4 默认 4096
              print(f"非标准页大小，尝试按 {page_size} 处理")
          
          # v0/v1/v2 格式：kernel_size 在 0x08, kernel_addr 在 0x0C
          kernel_size = struct.unpack_from("<I", header, 0x08)[0]
          ramdisk_size = struct.unpack_from("<I", header, 0x10)[0]
          second_size = struct.unpack_from("<I", header, 0x18)[0]
          
          print(f"Kernel size: {kernel_size}, Ramdisk size: {ramdisk_size}")
          
          if kernel_size == 0 or kernel_size > 200*1024*1024:
              # 尝试 v3/v4 格式
              print("尝试 v3/v4 格式解析...")
              kernel_size = struct.unpack_from("<I", header, 0x08)[0]
              ramdisk_size = struct.unpack_from("<I", header, 0x10)[0]
              print(f"v3/v4 Kernel size: {kernel_size}")
          
          if kernel_size == 0 or kernel_size > 200*1024*1024:
              print("ERROR: 无法解析内核大小，boot.img 可能是特殊格式")
              sys.exit(1)
          
          # 计算偏移量
          # header 占 1 页，kernel 紧随其后
          header_size = page_size
          kernel_offset = header_size
          
          with open(BOOTIMG, "rb") as f:
              f.seek(kernel_offset)
              kernel_data = f.read(kernel_size)
          
          with open(KERNEL_OUT, "wb") as f:
              f.write(kernel_data)
          
          print(f"成功提取内核: {len(kernel_data)} bytes -> {KERNEL_OUT}")
          EOF

      - name: 提取 vmlinux
        run: |
          # 安装 extract-vmlinux
          sudo wget -q https://raw.githubusercontent.com/torvalds/linux/master/scripts/extract-vmlinux -O /usr/local/bin/extract-vmlinux
          sudo chmod +x /usr/local/bin/extract-vmlinux
          
          mkdir -p output
          
          # 尝试提取 vmlinux
          extract-vmlinux kernel_raw > output/vmlinux || true
          
          # 如果失败，手动识别压缩格式
          if [ ! -s output/vmlinux ]; then
            echo "extract-vmlinux 失败，尝试手动解压..."
            file kernel_raw
            
            # 读取文件头判断压缩格式
            SIG=$(xxd -l 6 -p kernel_raw)
            echo "文件头: $SIG"
            
            case "$SIG" in
              1f8b*) 
                echo "检测到 gzip"
                zcat kernel_raw > output/vmlinux ;;
              425a*)
                echo "检测到 bzip2"
                bzcat kernel_raw > output/vmlinux ;;
              0221*|184d*)
                echo "检测到 lz4"
                lz4 -d kernel_raw output/vmlinux ;;
              28b5*)
                echo "检测到 zstd"
                zstd -d kernel_raw -o output/vmlinux ;;
              fd37*)
                echo "检测到 xz"
                xz -d -c kernel_raw > output/vmlinux ;;
              4d5a*|7f45*)
                echo "可能是 ELF 或未压缩镜像"
                cp kernel_raw output/vmlinux ;;
              *)
                echo "未知格式，直接复制"
                cp kernel_raw output/vmlinux ;;
            esac
          fi
          
          if [ -s output/vmlinux ]; then
            echo "✅ vmlinux 提取成功"
            file output/vmlinux
          else
            echo "::warning:: vmlinux 为空，可能解压失败"
          fi

      - name: 提取符号表
        run: |
          cd output
          if [ -f vmlinux ]; then
            aarch64-linux-gnu-nm -n vmlinux > symbols_all.txt 2>/dev/null || nm -n vmlinux > symbols_all.txt
            grep -E '^[0-9a-f]+ [Tt] ' symbols_all.txt | awk '{print $1, $3}' > functions.txt
            aarch64-linux-gnu-readelf -s vmlinux > symbols_detail.txt 2>/dev/null || readelf -s vmlinux > symbols_detail.txt
            readelf -S vmlinux > sections.txt
            echo "=== 提取完成 ==="
            wc -l symbols_all.txt functions.txt
          else
            echo "vmlinux 不存在"
          fi

      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: vmlinux-and-symbols
          path: output/
          retention-days: 30
